<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 12px; color: #111; }
  button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; width: 100%; }
  button.secondary { background: #fff; color: #111; margin-top: 6px; }
  textarea { width: 100%; height: 70px; box-sizing: border-box; font: 11px monospace; margin-top: 6px; }
  #out { margin-top: 10px; white-space: pre-wrap; } .warn { color: #b45309; } small { color: #555; }
</style></head><body>
  <button id="fill">Fill this page from my data</button>
  <p id="out"></p>
  <details><summary>Your data</summary>
    <small>In Career Agent: Profile, "Download fill data". Paste the file's text here once and press Save.</small>
    <textarea id="data" placeholder="Paste the contents of career-agent-fill-data.json"></textarea>
    <button class="secondary" id="save">Save</button>
  </details>
  <p><small>It fills what it can, outlines in orange what you must answer, and never presses Submit, never types a password or a payment or identity number.</small></p>
  <script src="popup.js"></script>
</body></html>
