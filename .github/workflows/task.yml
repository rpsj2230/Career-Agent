name: Background task

# Started by the buttons on the site (Find jobs now, Score new jobs, Prepare). Running here instead of inside the website means there is
# no 60-second limit: a task can take several minutes. Progress shows under Logs > Runs and in the banner on the Jobs page.
on:
  workflow_dispatch:
    inputs:
      task:
        description: discover, score, prepare or localtest
        required: true
      job_id:
        description: Job to prepare (task = prepare)
        required: false

concurrency:
  group: pipeline # never overlaps the scheduled pipeline, so two runs cannot score the same jobs at once
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ask the app whether the local model is needed for this run (hosted models failing, or you chose "always"); a repository variable LOCAL_MODEL forces it
      - id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCED: ${{ vars.LOCAL_MODEL }}
        run: |
          m="$FORCED"
          q=""; [ "${{ inputs.task }}" = "localtest" ] && q="?force=1"
          if [ -z "$m" ]; then m=$(curl -fsS -m 20 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/runner-config$q" | jq -r '.local_model // ""' 2>/dev/null || true); fi
          if [ -z "$m" ] && [ "${{ inputs.task }}" = "localtest" ]; then m="qwen2.5:3b-instruct"; fi
          echo "local_model=$m" >> "$GITHUB_OUTPUT"
          echo "Local model for this run: ${m:-none}"
      - name: Start local model (Ollama)
        if: steps.cfg.outputs.local_model != ''
        env:
          LOCAL_MODEL: ${{ steps.cfg.outputs.local_model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$LOCAL_MODEL"
      - run: npx tsx worker/task.ts
        env:
          LOCAL_MODEL: ${{ steps.cfg.outputs.local_model }}
          NODE_OPTIONS: --conditions=react-server
          TASK: ${{ inputs.task }}
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
