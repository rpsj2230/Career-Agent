name: Scheduled pipeline

# Runs your schedules (Schedules page). Every hour this asks the app whether anything is due; only then does it
# install and run the pipeline, so quiet hours cost a few seconds. "Run now" on the Schedules page starts it with
# schedule_id set.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      schedule_id:
        description: Run this schedule now (leave empty to run whatever is due)
        required: false
      chain:
        description: Internal. How many follow-on rounds have already run in a row (the backlog is cleared round after round)
        required: false
        default: "0"

permissions:
  contents: read
  actions: write # only so a round can start the next one while a backlog is waiting

concurrency:
  group: pipeline # two runs of the pipeline never overlap; a waiting tick is picked up afterwards
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE_ID: ${{ inputs.schedule_id }}
        run: |
          set -euo pipefail
          if [ -n "${SCHEDULE_ID:-}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          body=$(curl --fail-with-body -sS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/due")
          echo "$body"
          due=$(echo "$body" | jq -r '.due // 0')
          drain=$(echo "$body" | jq -r '.drain // false')
          # run when a schedule is due, or when jobs are waiting to be scored / prepared (the backlog is cleared hour by hour)
          if [ "$due" -gt 0 ] || [ "$drain" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  pipeline:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.p.outputs.ready_to_submit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional last-resort local model. Set the repository variable LOCAL_MODEL (e.g. qwen2.5:7b-instruct) to turn it on;
      # it is used only after every hosted model has failed or run out of quota, and its output goes through the same verifier.
      # ask the app whether the local model is needed for this run (hosted models failing, or you chose "always"); a repository variable LOCAL_MODEL forces it
      - id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCED: ${{ vars.LOCAL_MODEL }}
        run: |
          m="$FORCED"
          if [ -z "$m" ]; then m=$(curl -fsS -m 20 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/runner-config" | jq -r '.local_model // ""' 2>/dev/null || true); fi
          echo "local_model=$m" >> "$GITHUB_OUTPUT"
          echo "Local model for this run: ${m:-none}"
      - name: Start local model (Ollama)
        if: steps.cfg.outputs.local_model != ''
        env:
          LOCAL_MODEL: ${{ steps.cfg.outputs.local_model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$LOCAL_MODEL"
      - id: p
        run: npx tsx worker/pipeline.ts
        env:
          LOCAL_MODEL: ${{ steps.cfg.outputs.local_model }}
          NODE_OPTIONS: --conditions=react-server
          SCHEDULE_ID: ${{ inputs.schedule_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_TIMEZONE: ${{ secrets.APP_TIMEZONE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  apply:
    needs: pipeline
    if: needs.pipeline.outputs.ready != '' && needs.pipeline.outputs.ready != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: apply-worker # shared with the single-application workflow: one browser session at a time
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx worker/apply.ts
        env:
          MAX_APPLY: "25"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_STORAGE_STATE: ${{ secrets.LINKEDIN_STORAGE_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  # While jobs are still waiting to be scored or prepared, start the next round right away instead of waiting for the next hourly tick.
  # It stops by itself: the check asks the app whether work is waiting and whether the last rounds made progress, and at most 12 rounds run in a row.
  continue:
    needs: pipeline
    if: always() && needs.pipeline.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHAIN: ${{ inputs.chain }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n="${CHAIN:-0}"
          if [ "$n" -ge 12 ]; then echo "12 rounds in a row; the next hourly check carries on."; exit 0; fi
          body=$(curl --fail-with-body -sS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/due" || true)
          echo "$body"
          drain=$(echo "$body" | jq -r '.drain // false' 2>/dev/null || echo false)
          if [ "$drain" = "true" ]; then
            gh workflow run pipeline.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" -f chain=$((n + 1))
            echo "Started follow-on round $((n + 1))."
          else
            echo "Nothing more to do right now."
          fi
