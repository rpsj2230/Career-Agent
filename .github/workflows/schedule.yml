name: Scheduled discovery and scoring

# Free, more frequent than Vercel Hobby cron (which allows once a day).
on:
  schedule:
    - cron: "30 2 * * *"   # discover + first scoring pass (09:00 IST)
    - cron: "0 7 * * *"    # score backlog
    - cron: "0 13 * * *"   # discover + score again
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for path in discover score; do
            echo "== $path"
            curl --fail-with-body -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$path" | head -c 2000
            echo
          done
