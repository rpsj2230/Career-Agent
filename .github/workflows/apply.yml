name: Apply (worker)

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: Application id approved in the dashboard
        required: true

concurrency:
  group: apply-worker # one application at a time; also keeps pacing human-like

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx worker/apply.ts
        env:
          APPLICATION_ID: ${{ inputs.application_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_STORAGE_STATE: ${{ secrets.LINKEDIN_STORAGE_STATE }}
