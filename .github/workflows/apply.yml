name: Apply (worker)

on:
  # a sweep every hour sends any approved automatic application that a started run missed (a run cancelled because another was waiting, a failed start)
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      application_id:
        description: Application id approved in the dashboard (empty = send every automatic application that was approved)
        required: false

concurrency:
  group: apply-worker # one application at a time; also keeps pacing human-like

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx worker/apply.ts
        env:
          NODE_OPTIONS: --conditions=react-server
          APPLICATION_ID: ${{ inputs.application_id }}
          MAX_APPLY: "25"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINKEDIN_STORAGE_STATE: ${{ secrets.LINKEDIN_STORAGE_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
