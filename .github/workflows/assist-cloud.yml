name: Cloud assistant (employer pages)

# Applies, from a GitHub runner, to applications on employers' own pages (the ones that need no sign-in), so they do not wait for your
# computer. It works only while Autopilot has switched "cloud assistant" on. The assistant on your computer lets it have the first go and
# takes over any application that has waited more than 90 minutes.
# LinkedIn, Indeed, Naukri and anything else that needs your sign-in stay with the assistant on your computer.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-assistant # one browser at a time
  cancel-in-progress: false

jobs:
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx worker/assist.ts
        env:
          NODE_OPTIONS: --conditions=react-server
          ASSIST_MODE: auto
          ASSIST_ONLY: employer
          ASSIST_HEADLESS: "1"
          ASSIST_NO_HEARTBEAT: "1"
          ASSIST_WORKER: github
          # a sign-in page, CAPTCHA or job-board link this runner cannot get past is passed to the assistant on your computer, not handed to you
          ASSIST_FAILOVER: "1"
          # employer sites have no account to protect: a short pause between applications, so a run gets through many more
          ASSIST_AUTO_PAUSE_MS: "4000"
          ASSIST_LIMIT: "60"
          ASSIST_MAX_MINUTES: "45"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
