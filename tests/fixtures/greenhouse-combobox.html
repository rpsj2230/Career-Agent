<!doctype html><html><body>
<form id="f">
  <label for="fn">First Name *</label><input id="fn" name="first_name" required>
  <label for="ln">Last Name *</label><input id="ln" name="last_name" required>
  <label for="em">Email *</label><input id="em" name="email" type="email" required>
  <label for="rs">Resume/CV *</label><input id="rs" name="resume" type="file" required>
  <label id="cl" for="country">Country *</label>
  <div class="select"><input id="country" role="combobox" aria-labelledby="cl" aria-required="true" aria-expanded="false" readonly></div>
  <button type="submit">Submit application</button>
</form>
<script>document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>'; });</script>
</body></html>
