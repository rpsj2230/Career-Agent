<!doctype html><html><body>
<h1>Product Manager</h1>
<form id="form" novalidate>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_name" class="_label">Name<span> *</span></label><input id="_systemfield_name" name="_systemfield_name" type="text" required></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_email" class="_label">Email<span> *</span></label><input id="_systemfield_email" name="_systemfield_email" type="email" required></div>
  <div class="ashby-application-form-field-entry"><label for="phone" class="_label">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="ashby-application-form-field-entry"><label for="resume" class="_label">Resume<span> *</span></label><input id="resume" name="_systemfield_resume" type="file" required></div>
  <div class="ashby-application-form-field-entry"><label for="ctc" class="_label">What is your expected CTC?<span> *</span></label><input id="ctc" name="ctc" type="text" required></div>
  <div id="extra"></div>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form>
<script>
  if (location.hash === '#sponsor') document.getElementById('extra').innerHTML = '<div><label for="sp">Will you now or in the future require visa sponsorship?<span> *</span></label><input id="sp" type="text" required></div>';
  document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); document.body.innerHTML = '<h2>Your application has been submitted.</h2><p>Thanks for applying!</p>'; });
</script>
</body></html>
