<html><head><title>Role | Co | LinkedIn</title></head><body>
<header id="global-nav"><input type="text" role="combobox" aria-label="Search"></header>
<div id="hidden-early" role="dialog" hidden><input name="decoy"></div>
<main><button aria-label="Easy Apply to this job" onclick="document.getElementById('d').showModal()">Easy Apply</button></main>
<dialog id="d">
  <h2>Apply to Co</h2>
  <div class="page" data-p="1"><h3>Contact info</h3>
    <label for="em">Email address*</label><select id="em" required><option>a@x.com</option></select>
    <label for="ph">Mobile phone number*</label><input id="ph" type="tel" value="87161454" required>
    <button type="button" onclick="go(2)">Next</button></div>
  <div class="page" data-p="2" hidden><h3>Resume</h3>
    <label><input type="radio" name="resume" checked> resume.pdf</label><input type="file" id="f" hidden>
    <button type="button" onclick="go(3)">Next</button></div>
  <div class="page" data-p="3" hidden><h3>Additional questions</h3>
    <label for="yrs">How many years of experience do you have?*</label><input id="yrs" type="text" required>
    <button type="button" onclick="go(4)">Review</button></div>
  <div class="page" data-p="4" hidden><h3>Review your application</h3>
    <button type="button" onclick="window.sent = true">Submit application</button></div>
</dialog>
<script>
  window.sent = false;
  function go(n) { document.querySelectorAll('.page').forEach(p => p.hidden = p.dataset.p != n); }
</script></body></html>
