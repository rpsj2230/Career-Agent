<html><head><title>Apply | Splend</title></head><body><form>
<label for="fn">First name*</label><input id="fn" name="first" required>
<fieldset><legend>Are you legally eligible to work in the UK?*</legend>
  <label><input type="checkbox" id="elig-yes" required> Yes</label>
  <label><input type="checkbox" id="elig-no" required> No</label></fieldset>
<div role="group" aria-labelledby="tl"><span id="tl">Are you comfortable with travel up to 25%?*</span>
  <label><input type="checkbox" id="trav-yes" aria-required="true"> Yes</label>
  <label><input type="checkbox" id="trav-no" aria-required="true"> No</label></div>
<fieldset><legend>Legal</legend>
  <label><input type="checkbox" id="terms" required> I agree to the Terms and Conditions</label>
  <label><input type="checkbox" id="priv" required> I have read the privacy policy</label></fieldset>
<label><input type="checkbox" id="vet" required> I am a veteran</label>
<button type="submit">Submit application</button></form></body></html>
